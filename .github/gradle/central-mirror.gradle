// Hosted runners share Maven Central rate limits. Use the Google-hosted Central mirror.
def useCentralMirror = { repositories ->
    repositories.withType(MavenArtifactRepository).all { repository ->
        if (repository.url.host in ['repo.maven.apache.org', 'repo1.maven.org']) {
            repository.url = uri('https://maven-central.storage-download.googleapis.com/maven2')
        }
    }
}
beforeSettings { settings ->
    settings.pluginManagement.repositories {
        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
        google()
        gradlePluginPortal()
    }
    useCentralMirror(settings.pluginManagement.repositories)
    useCentralMirror(settings.dependencyResolutionManagement.repositories)
}
beforeProject { project ->
    useCentralMirror(project.buildscript.repositories)
    useCentralMirror(project.repositories)
}
