name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [build/android-installable]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build standalone APK for Android phones
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: lbs-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
