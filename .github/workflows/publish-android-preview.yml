name: Publish verified Android preview
on:
  push:
    branches: [publish/android-v0.1.3]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the built app
        uses: actions/download-artifact@v4
        with:
          run-id: 45264794711
          github-token: ${{ github.token }}
          name: lbs-android
          path: ${{ runner.temp }}/lbs-release
      - name: Apply the preview signature and verify exact APK
        working-directory: ${{ runner.temp }}/lbs-release
        run: |
          git apply --binary "$GITHUB_WORKSPACE/.github/release/preview-signature.patch"
          mv app-release.apk LBS-Interior-Studio-0.1.3.apk
          echo '3a67355d1957940d2c96877407d53066d05e3848f359ff9d74a1d73259de7aec  LBS-Interior-Studio-0.1.3.apk' | sha256sum -c -
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.3 "$RUNNER_TEMP/lbs-release/LBS-Interior-Studio-0.1.3.apk" --target 40ca1ec97892dc1efe1ebf805bfa752e54701458 --title 'LBS Interior Studio 0.1.3 for Android' --notes-file .github/release/android-notes.md --prerelease
